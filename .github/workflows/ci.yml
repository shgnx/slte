# SLTE 质量门禁（push + PR 自动）
#
# 与 build.yml（手动一键编译）互补：每次 push 到 main / PR 时运行快速质量检查——
# 编译（debug）、单元测试、ktlint 格式、Android Lint，保证代码在进入集成前不破。
#
# 注意：本工作流与 build.yml 共用构建脚本依赖的默认占位值（无 SLTE_* 注入），
# 仅验证「代码可编译 + 测试通过 + 无风格/静态问题」，不产出可发布包。
# 发布包仍通过 build.yml（workflow_dispatch）手动构建。

name: SLTE CI

on:
  push:
    # 门禁主干：main/master 及任意 tag；开发分支不经此处，避免噪音
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 质量门禁（test + ktlint + lint）
    runs-on: ubuntu-latest
    # 与 build.yml 保持一致：海外 runner 直连官方仓库（aliyun 镜像在 runner 上
    # 曾导致插件/KSP 解析失败，见 settings.gradle.kts 的 useAliyunMirror 注释）
    env:
      SLTE_USE_MIRROR: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        # 依赖/配置缓存复用；PR 分支只读缓存（仅为 main 写回）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 安装 Android SDK / NDK
        # 门禁同样需要 SDK；libbridge 的 C 交叉编译需要 NDK。此处不重复跑 ktlint/lint 的 SDK 安装，
        # 直接装到与 build.yml 一致的版本。
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "::error::找不到 sdkmanager（ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT）"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: 编译 + 单元测试
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: 仪器化测试编译检查
        # 不启模拟器（runner 上跑 emulator 既慢又不稳定），但必须保证 androidTest 源码
        # 能编译——否则共享组件签名变更后，仪器化测试会静默腐烂到下次人工连接设备才发现。
        # 真机/模拟器执行：./gradlew :app:connectedDebugAndroidTest
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Release 混淆路径校验
        # 为什么必须单独校验 release：有一类缺陷**构建成功也不报错**，只在运行时才炸，
        # 且 debug 不混淆所以完全正常——本仓库真实发生过：proguard 规则里的 allowshrinking
        # 让 R8 删掉 31 个 @Serializable DTO，Retrofit 泛型签名退化成 raw Object，
        # 于是每个接口在发请求前抛 Unable to create converter，界面只显示"请求失败"。
        # 光"能构建出 release"拦不住它，因此这里额外跑 verifyReleaseApiSurvivors：
        # 它比对 R8 的 mapping.txt，断言 data/remote 下所有 @Serializable DTO 与
        # Retrofit 接口都还在（详见 app/build.gradle.kts 里该任务的说明）。
        env:
          # 仅为了让 release 变体能真正跑起来：构建脚本禁止在没有签名配置时执行 release 任务
          # （防止误用 debug 签名发布）。这里用一次性临时 keystore，不接触任何真实密钥，
          # 产物也不上传，只为验证 R8 与存活校验。
          SLTE_RELEASE_STORE_FILE: ${{ runner.temp }}/ci-throwaway.keystore
          SLTE_RELEASE_STORE_PASSWORD: ci-throwaway
          SLTE_RELEASE_KEY_ALIAS: ci-throwaway
          SLTE_RELEASE_KEY_PASSWORD: ci-throwaway
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$SLTE_RELEASE_STORE_FILE" \
            -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=CI-Throwaway, OU=CI, O=CI, C=CN"
          ./gradlew :app:minifyReleaseWithR8 :app:verifyReleaseApiSurvivors

      - name: ktlint + Android Lint
        run: |
          ./gradlew :app:ktlintCheck :app:lintDebug

          # 图标统一守卫：页面禁止直接写 Material Icons，必须引用唯一图标库 SlteIcons
          # （见 UI-GUIDELINES §3.4；与 build.yml 门禁保持一致）
          if rg -n 'Icons\.(AutoMirrored\.)?(Outlined|Rounded|Filled|Sharp|TwoTone)\.' \
               app/src/main/java --glob '!**/ui/theme/SlteIcons.kt'; then
            echo "::error::页面出现裸 Icons.* 引用，请改为 SlteIcons.*（UI-GUIDELINES §3.4）"
            exit 1
          fi

      - name: 上传检查报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SLTE-CI-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/ktlint/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30